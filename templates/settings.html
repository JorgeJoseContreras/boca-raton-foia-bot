<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Application Settings - FOIA Automation Manager</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background-color: #f4f6f9;
            color: #333333;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 900px;
            margin: 30px auto;
            background: #ffffff;
            border: 1px solid #e1e4e8;
            border-radius: 6px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            padding: 30px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #2b5797;
            padding-bottom: 15px;
            margin-bottom: 25px;
        }

        h1 {
            margin: 0;
            font-size: 22px;
            color: #2b5797;
        }

        .btn-group {
            display: flex;
            gap: 10px;
        }

        .btn {
            background-color: #2b5797;
            color: white;
            border: none;
            padding: 10px 18px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            text-decoration: none;
        }

        .btn:hover {
            background-color: #1e3d6b;
        }

        .btn-secondary {
            background-color: #6c757d;
        }

        .btn-secondary:hover {
            background-color: #5a6268;
        }

        .card {
            background: #fafafa;
            border: 1px solid #e1e4e8;
            border-radius: 6px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .card-title {
            font-size: 16px;
            font-weight: bold;
            color: #2b5797;
            margin-bottom: 15px;
            border-bottom: 1px solid #e1e4e8;
            padding-bottom: 8px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 5px;
            color: #444;
        }

        .form-group select, .form-group textarea, .form-group input[type="text"] {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 13px;
            box-sizing: border-box;
            font-family: inherit;
        }

        .radio-group {
            display: flex;
            gap: 20px;
            margin-top: 5px;
        }

        .radio-group label {
            font-weight: normal;
            font-size: 13px;
            cursor: pointer;
        }

        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #333;
            color: #fff;
            padding: 12px 20px;
            border-radius: 4px;
            font-size: 14px;
            display: none;
            z-index: 3000;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div>
                <h1>Application and Automation Settings</h1>
                <div style="font-size: 13px; color: #666; margin-top: 4px;">Fine-tune FOIA templates, date offsets, and portal defaults.</div>
            </div>
            <div class="btn-group">
                <a href="/" class="btn btn-secondary">Back to Dashboard</a>
                <button class="btn" onclick="saveSettings()">Save All Settings</button>
            </div>
        </header>

        <!-- FOIA Template & AI Settings -->
        <div class="card">
            <div class="card-title">1. FOIA Request Content and AI Settings</div>
            
            <div class="form-group">
                <label>Dynamic AI Rephrasing Mode</label>
                <div class="radio-group">
                    <label>
                        <input type="radio" name="use_gemini_ai" value="true" {% if settings.use_gemini_ai != 'false' %}checked{% endif %}>
                        Use Gemini AI (Rephrase dynamically per request)
                    </label>
                    <label>
                        <input type="radio" name="use_gemini_ai" value="false" {% if settings.use_gemini_ai == 'false' %}checked{% endif %}>
                        Use Static Template (Same text every time, no Gemini call)
                    </label>
                </div>
            </div>

            <div class="form-group">
                <label for="foiaTemplate">Default FOIA Request Text Template</label>
                <textarea id="foiaTemplate" rows="6">{{ settings.foia_template }}</textarea>
            </div>
        </div>

        <!-- Date Range Settings -->
        <div class="card">
            <div class="card-title">2. Date Range Preference</div>
            <div class="form-group">
                <label for="startDateOffset">Default Start Date Offset</label>
                <select id="startDateOffset">
                    <option value="30" {% if settings.start_date_days_ago == '30' %}selected{% endif %}>Last 30 Days</option>
                    <option value="60" {% if settings.start_date_days_ago == '60' %}selected{% endif %}>Last 60 Days</option>
                    <option value="90" {% if settings.start_date_days_ago == '90' %}selected{% endif %}>Last 90 Days</option>
                    <option value="180" {% if settings.start_date_days_ago == '180' %}selected{% endif %}>Last 180 Days</option>
                    <option value="365" {% if settings.start_date_days_ago == '365' %}selected{% endif %}>Last 365 Days (1 Year)</option>
                </select>
            </div>
        </div>

        <!-- Delray Beach GovQA Defaults -->
        <div class="card">
            <div class="card-title">3. Delray Beach GovQA Portal Defaults</div>
            
            <div class="form-group">
                <label for="delrayDept">Department Requesting Record(s) From</label>
                <select id="delrayDept">
                    <option value="Code Enforcement" {% if settings.delray_dept == 'Code Enforcement' or not settings.delray_dept %}selected{% endif %}>Code Enforcement</option>
                    <option value="Building Department" {% if settings.delray_dept == 'Building Department' %}selected{% endif %}>Building Department</option>
                    <option value="Business Tax" {% if settings.delray_dept == 'Business Tax' %}selected{% endif %}>Business Tax</option>
                    <option value="City Attorney" {% if settings.delray_dept == 'City Attorney' %}selected{% endif %}>City Attorney</option>
                    <option value="City Clerk" {% if settings.delray_dept == 'City Clerk' %}selected{% endif %}>City Clerk</option>
                    <option value="City Manager's Office" {% if settings.delray_dept == "City Manager's Office" %}selected{% endif %}>City Manager's Office</option>
                    <option value="Community Improvement" {% if settings.delray_dept == 'Community Improvement' %}selected{% endif %}>Community Improvement</option>
                    <option value="Development Services/Planning & Zoning" {% if settings.delray_dept == 'Development Services/Planning & Zoning' %}selected{% endif %}>Development Services/Planning & Zoning</option>
                    <option value="Finance" {% if settings.delray_dept == 'Finance' %}selected{% endif %}>Finance</option>
                    <option value="Fire" {% if settings.delray_dept == 'Fire' %}selected{% endif %}>Fire</option>
                    <option value="Human Resources" {% if settings.delray_dept == 'Human Resources' %}selected{% endif %}>Human Resources</option>
                    <option value="Parks and Recreation" {% if settings.delray_dept == 'Parks and Recreation' %}selected{% endif %}>Parks and Recreation</option>
                </select>
            </div>

            <div class="form-group">
                <label for="delrayRecordType">Type of Record(s) Requested</label>
                <select id="delrayRecordType">
                    <option value="Code Violations" {% if settings.delray_record_type == 'Code Violations' or not settings.delray_record_type %}selected{% endif %}>Code Violations</option>
                    <option value="Abandoned Properties" {% if settings.delray_record_type == 'Abandoned Properties' %}selected{% endif %}>Abandoned Properties</option>
                    <option value="Code Enforcement Cases" {% if settings.delray_record_type == 'Code Enforcement Cases' %}selected{% endif %}>Code Enforcement Cases</option>
                    <option value="Other (Code Enforcement)" {% if settings.delray_record_type == 'Other (Code Enforcement)' %}selected{% endif %}>Other (Code Enforcement)</option>
                </select>
            </div>
        </div>
    </div>

    <div class="toast" id="toast">Notification</div>

    <script>
        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.style.display = 'block';
            setTimeout(() => t.style.display = 'none', 3000);
        }

        async function saveSettings() {
            showToast("Saving settings...");
            
            const use_ai = document.querySelector('input[name="use_gemini_ai"]:checked').value;
            const template = document.getElementById('foiaTemplate').value;
            const offset = document.getElementById('startDateOffset').value;
            const dept = document.getElementById('delrayDept').value;
            const rtype = document.getElementById('delrayRecordType').value;

            try {
                const res = await fetch('/api/settings', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        use_gemini_ai: use_ai,
                        foia_template: template,
                        start_date_days_ago: offset,
                        delray_dept: dept,
                        delray_record_type: rtype
                    })
                });
                const data = await res.json();
                showToast("Settings saved successfully.");
            } catch (err) {
                showToast("Error saving settings.");
            }
        }
    </script>
</body>
</html>
