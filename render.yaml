services:
  - type: web
    name: boca-raton-foia-bot
    env: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn app:app"
    envVars:
      - key: SENDER_EMAIL
        value: "jorge.properties.123@gmail.com"
      - key: SENDER_PASSWORD
        sync: false
      - key: TARGET_EMAIL
        value: "brcityclerk@myboca.us"
      - key: GEMINI_API_KEY
        sync: false
      - key: IMAP_SERVER
        value: "imap.gmail.com"
      - key: SMTP_SERVER
        value: "smtp.gmail.com"
    disk:
      name: sqlite-data
      mountPath: /data
      sizeGB: 1
